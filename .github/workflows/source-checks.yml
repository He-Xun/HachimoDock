name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - name: Check official desktop Node.js binary
        run: node --input-type=module -e "import { verifyNodeRuntime } from './pc/scripts/dependency-license-resources.mjs'; verifyNodeRuntime(process.execPath)"
      - run: node pc/scripts/check-source-safety.mjs
      - run: node --test pc/scripts/check-source-safety.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python pc/scripts/stage-release-firmware.py
      - run: npm ci
        working-directory: pc
      - run: npm test
        working-directory: pc
      - name: Build and exercise the Win32 ACL verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ x64 toolchain unavailable' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /s /c ('""{0}" && node pc/scripts/build-windows-acl.mjs"' -f $vcvars)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = 'pc/src-tauri/generated-runtime/windows-acl.exe'
          New-Item -ItemType Directory -Path 'pc/src-tauri/dsh-bridge' -Force | Out-Null
          Copy-Item $helper 'pc/src-tauri/dsh-bridge/windows-acl.exe'
          Copy-Item $helper 'integrations/dsh-hachimodock/windows-acl.exe'
          node --test integrations/dsh-hachimodock/test/windows-acl.test.js integrations/dsh-hachimodock/test/managed-install.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:bridge
        working-directory: pc
        timeout-minutes: 10
      - run: npm run build:web
        working-directory: pc
  firmware-host:
    runs-on: ubuntu-latest
    env:
      CLANG: clang-20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select the reproducible WASM toolchain
        run: |
          test -x /usr/lib/llvm-20/bin/clang
          test -x /usr/lib/llvm-20/bin/wasm-ld
          /usr/lib/llvm-20/bin/clang --version
          /usr/lib/llvm-20/bin/wasm-ld --version
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - run: python -m pip install Pillow pytest platformio==6.1.19
      - name: Restore locked SDK downloads
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
            ${{ runner.temp }}/p4-ci-inputs/*.tar.gz
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock', 'firmware/tools/prepare_ci_sdk.py') }}
          restore-keys: p4-sdk-${{ runner.os }}-
      - name: Prepare pinned WAMR and locked v1, v3 and Hosted SDK test inputs
        run: python firmware/tools/prepare_ci_sdk.py --v3-core "$RUNNER_TEMP/p4-v3-core" --input-cache "$RUNNER_TEMP/p4-ci-inputs"
      - name: Save prepared SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
            ${{ runner.temp }}/p4-ci-inputs/*.tar.gz
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock', 'firmware/tools/prepare_ci_sdk.py') }}
      - name: Fetch only locked radio host harness dependencies
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu --manifest-path firmware/tests/radio_pc_lifecycle_harness/Cargo.toml
      - run: python -m pytest firmware/tests -q
      - run: python firmware/tests/protocol_contract_test.py
      - run: python firmware/tools/build_builtin_bundle.py --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Verify the scoped scanner exception
        run: python3 pc/scripts/check-gitleaks-policy.py --scanner "$RUNNER_TEMP/gitleaks"
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
